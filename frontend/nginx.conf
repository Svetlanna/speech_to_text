# Règles de nginx pour le front Compte-rendu médical

server {
    listen 80;                          # nginx écoute sur le port 80, à l'intérieur du conteneur
    root /usr/share/nginx/html;         # dossier où sont copiées les pages
    index index.html;                   # page par défaut quand on demande "/"

    client_max_body_size 25m;           # accepte les envois jusqu'à 25 Mo, comme TAILLE_MAX_AUDIO dans l'API

    # Tout ce qui commence par /api/ est transmis à l'API FastAPI
    location /api/ {
        proxy_pass http://api:8000/;    # "api" = nom du service dans docker-compose.yml
        proxy_read_timeout 300s;        # laisse jusqu'à 5 minutes à Whisper pour répondre
    }
}