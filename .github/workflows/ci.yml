name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check .

  test-unit:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/unit -v                         # seulement les tests SANS MySQL

  test-integration:
    runs-on: ubuntu-latest
    needs: test-unit                                      # seulement si les tests unitaires ont réussi
    services:
      mysql:                                              # une MySQL temporaire, jetée à la fin
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root                   # mot de passe jetable, base vide et temporaire
        ports:
          - 3333:3306
        options: >-
           --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:                                                  # remplace le .env (qui n'existe pas sur GitHub)
      DB_HOTE: 127.0.0.1
      DB_PORT: "3333"
      DB_UTILISATEUR: root
      DB_MOT_DE_PASSE: root
      DB_NOM: compte_rendu_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m app.init_db
      - run: pytest tests/integration -v
  docker:
    runs-on: ubuntu-latest
    needs: test-integration
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t app-compte-rendu ./backend
      - run: docker run -d --name api -p 8000:8000 app-compte-rendu      # -d · tourne en arrière-plan
      - run: |                                                            # attend jusqu'à 20 s que l'API réponde
          for i in $(seq 1 20); do
            curl -fs http://localhost:8000/sante && exit 0
            sleep 1
          done
          docker logs api
          exit 1