name: CI

on:
  push:
    branches: [main, dev]      # la CI surveille aussi ta branche de travail
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip                                      # garde les téléchargements pip entre deux CI
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt  # mêmes versions qu'en local
      - run: ruff check .

  test-unit:
    runs-on: ubuntu-latest
    needs: lint                                           # seulement si le lint a réussi
    defaults:
      run:
        working-directory: backend                        # toutes les commandes run partent de backend/
    steps:
      - uses: actions/checkout@v5                         # 1. récupère ton code
      - uses: actions/setup-python@v6                     # 2. installe Python 3.14
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt  # chemin depuis la racine (ce n'est pas un run)
      - run: pip install -r requirements-dev.txt          # 3. installe faster-whisper, pytest, ruff
      - run: pytest -v                                    # 4. lance les tests · lit backend/pyproject.toml

  docker:
    runs-on: ubuntu-latest
    needs: test-unit                                      # seulement si les tests ont réussi
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t app-compte-rendu ./backend
      - run: docker run --rm app-compte-rendu python -c "from app.transcription import transcrire; print('Import OK')"